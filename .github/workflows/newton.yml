name: Newton

on:
  schedule:
    - cron: '57 4 * * *'
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_cuda:
        description: Run on a self-hosted CUDA runner
        type: boolean
        default: false
      cuda_arch:
        description: CUDA compute capability without a decimal point
        type: string
        default: '75'

permissions:
  contents: read

env:
  SCFD_ROOT: ${{ github.workspace }}/contrib/SCFD
  NMFD_OPERATIONS_ROOT: ${{ github.workspace }}/contrib/nmfd-operations
  NMFD_LINSOLVERS_ROOT: ${{ github.workspace }}/contrib/nmfd-linsolvers

defaults:
  run:
    shell: bash

jobs:
  cpu:
    if: github.event_name != 'schedule'
    name: ${{ matrix.compiler }} / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [cpu, clang]
        test:
          - headers_cpu
          - failure_reporting
          - backtracking
          - convergence
          - residual_norm
          - vector_ownership
          - configuration
          - operator_binding
          - dependency_ownership
          - linsolvers
          - ch_serial
          - ch_omp
          - ch_original
          - operations_cpu
          - solvers_cpu
          - dense_cpu
          - hierarchy_cpu
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install compiler
        run: |
          sudo apt-get update
          packages=(build-essential make)
          if [[ '${{ matrix.compiler }}' == clang ]]; then
            packages+=(clang libomp-dev)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Build and test
        run: |
          make -j2 'check_${{ matrix.test }}' \
            CONFIG_FILE='build_configs/config_${{ matrix.compiler }}.inc' \
            BUILD_DIR='build/${{ matrix.compiler }}/${{ matrix.test }}'

  mpi:
    if: github.event_name != 'schedule'
    name: Original Cahn-Hilliard / MPI / ${{ matrix.ranks }} ranks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ranks: [1, 2, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: make -j2 check_ch_mpi MPI_NP=${{ matrix.ranks }} MPIEXEC_FLAGS=--oversubscribe

  sanitizers:
    if: github.event_name != 'schedule'
    name: GCC / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make -j2 test_cpu CONFIG_FILE=build_configs/config_sanitizers.inc BUILD_DIR=build/sanitizers

  cuda:
    name: CUDA / operations and Newton
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda
    runs-on: [self-hosted, linux, cuda]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and test
        env:
          CUDA_ARCH: ${{ inputs.cuda_arch }}
        run: make -j2 check_cuda check_headers_cuda BUILD_DIR=build/cuda CUDA_ARCH="$CUDA_ARCH"

  latest-dependencies:
    name: Latest dependencies / CPU and MPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Select designated dependency branch tips
        run: |
          git submodule foreach '
            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch") &&
            git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          '
          git submodule update --init --remote --no-fetch --checkout
          git rev-parse HEAD
          git submodule status
      - run: sudo apt-get update && sudo apt-get install -y build-essential make openmpi-bin libopenmpi-dev
      - name: Verify latest dependencies without changing pins
        run: |
          make -j2 test_cpu check_headers_cpu check_ch_original check_ch_mpi \
            BUILD_DIR=build/latest MPI_NP=2 MPIEXEC_FLAGS=--oversubscribe TEST_OMP_NUM_THREADS=2
